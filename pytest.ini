[pytest]
pythonpath = .
testpaths = tests
addopts = -ra -q --strict-markers -n8
markers =
    slow: tests that require network or long-running commands (e.g. npm install)
    cli: tests that exercise skill CLI scripts via subprocess
# Don't try to collect dataclasses that live inside the runtime package or the
# generated application template.
norecursedirs = arcbench_agent_runtime template
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    # invalid escape sequences are preserved today but slated to become
    # SyntaxError; fail loudly so new ones in test modules error out at
    # collection (not covered: compilation during pytest startup).
    error::SyntaxWarning
